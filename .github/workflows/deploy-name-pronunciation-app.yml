name: Deploy Name Pronunciation App

on:
  push:
    branches:
      - main
      - claude/name-pronunciation-app-8kdnic
    paths:
      - 'apps/name-pronunciation-app/**'
      - '.github/workflows/deploy-name-pronunciation-app.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/name-pronunciation-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
